<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">SonClarus ML processing pipeline</title>
  <desc id="description">The backend dispatches selected stages through four Kafka topics. Four independent ML consumers download inputs from S3-compatible storage, run their models, upload outputs, and publish results to Kafka for the backend to save and dispatch the next selected stage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58708f"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15847b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #10243a; font-size: 31px; font-weight: 700; }
      .subtitle { fill: #52657a; font-size: 15px; }
      .section { fill: #61758b; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .node-title { fill: #17324d; font-size: 17px; font-weight: 700; }
      .node-copy { fill: #52657a; font-size: 13px; }
      .topic-text { fill: #183750; font-size: 14px; font-weight: 600; }
      .tag { fill: #53677c; font-size: 11px; font-weight: 600; }
      .lane { fill: #fbfcfe; stroke: #e5ebf2; stroke-width: 1.3; }
      .line { fill: none; stroke: #58708f; stroke-width: 2.2; marker-end: url(#arrow); }
      .bi-line { fill: none; stroke: #58708f; stroke-width: 2.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .bus { fill: none; stroke: #58708f; stroke-width: 2.2; }
      .teal-line { fill: none; stroke: #15847b; stroke-width: 2.4; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect width="1440" height="900" rx="22" fill="#f5f8fb"/>
  <text x="64" y="70" class="title">SonClarus ML processing pipeline</text>
  <text x="64" y="101" class="subtitle">Four independent consumers run in parallel; the backend selects and queues each job’s next stage.</text>

  <text x="64" y="155" class="section">BACKEND ORCHESTRATION</text>
  <text x="365" y="155" class="section">STAGE INPUT TOPICS</text>
  <text x="652" y="155" class="section">PARALLEL ML CONSUMERS</text>
  <text x="1082" y="155" class="section">SHARED ARTIFACT STORAGE</text>

  <!-- Subtle horizontal lanes keep each topic paired with its consumer. -->
  <rect x="48" y="174" width="1344" height="132" rx="16" class="lane"/>
  <rect x="48" y="318" width="1344" height="132" rx="16" class="lane"/>
  <rect x="48" y="462" width="1344" height="132" rx="16" class="lane"/>
  <rect x="48" y="606" width="1344" height="132" rx="16" class="lane"/>

  <!-- Backend owns stage order, job state, and database writes. -->
  <rect x="72" y="337" width="238" height="192" rx="16" fill="#eaf1fb" stroke="#b8c9df" stroke-width="1.5"/>
  <rect x="91" y="357" width="34" height="24" rx="6" fill="#365f91"/>
  <text x="108" y="374" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">API</text>
  <text x="91" y="410" class="node-title">Backend</text>
  <text x="91" y="435" class="node-copy">1. Queues the selected stage</text>
  <text x="91" y="456" class="node-copy">2. Saves the ML result</text>
  <text x="91" y="477" class="node-copy">3. Queues the next stage</text>
  <text x="91" y="505" class="tag">Job state and stage order</text>

  <!-- One input topic and one isolated consumer process per model. -->
  <rect x="365" y="211" width="210" height="58" rx="12" fill="#e8f4f1" stroke="#acd7cd" stroke-width="1.4"/>
  <circle cx="388" cy="240" r="7" fill="#15847b"/>
  <text x="406" y="245" class="topic-text">denoise</text>
  <rect x="365" y="355" width="210" height="58" rx="12" fill="#e8f4f1" stroke="#acd7cd" stroke-width="1.4"/>
  <circle cx="388" cy="384" r="7" fill="#15847b"/>
  <text x="406" y="389" class="topic-text">separate</text>
  <rect x="365" y="499" width="210" height="58" rx="12" fill="#e8f4f1" stroke="#acd7cd" stroke-width="1.4"/>
  <circle cx="388" cy="528" r="7" fill="#15847b"/>
  <text x="406" y="533" class="topic-text">transcribe</text>
  <rect x="365" y="643" width="210" height="58" rx="12" fill="#e8f4f1" stroke="#acd7cd" stroke-width="1.4"/>
  <circle cx="388" cy="672" r="7" fill="#15847b"/>
  <text x="406" y="677" class="topic-text">summarize</text>

  <rect x="652" y="190" width="310" height="100" rx="14" fill="#ffffff" stroke="#d2deea" stroke-width="1.5"/>
  <rect x="652" y="190" width="7" height="100" rx="3.5" fill="#4679b8"/>
  <text x="677" y="222" class="node-title">Denoise</text>
  <text x="677" y="247" class="node-copy">DeepFilterNet3 · cleans the input audio</text>
  <text x="677" y="270" class="tag">1 audio file → 1 cleaned audio file</text>

  <rect x="652" y="334" width="310" height="100" rx="14" fill="#ffffff" stroke="#d2deea" stroke-width="1.5"/>
  <rect x="652" y="334" width="7" height="100" rx="3.5" fill="#7659a8"/>
  <text x="677" y="366" class="node-title">Separate</text>
  <text x="677" y="391" class="node-copy">SpeechBrain SepFormer · splits speakers</text>
  <text x="677" y="414" class="tag">1 audio file → 2 speaker tracks</text>

  <rect x="652" y="478" width="310" height="100" rx="14" fill="#ffffff" stroke="#d2deea" stroke-width="1.5"/>
  <rect x="652" y="478" width="7" height="100" rx="3.5" fill="#c27a24"/>
  <text x="677" y="510" class="node-title">Transcribe</text>
  <text x="677" y="535" class="node-copy">Faster Whisper · turns audio into text</text>
  <text x="677" y="558" class="tag">1 file or 2 tracks → 1 transcript</text>

  <rect x="652" y="622" width="310" height="100" rx="14" fill="#ffffff" stroke="#d2deea" stroke-width="1.5"/>
  <rect x="652" y="622" width="7" height="100" rx="3.5" fill="#25836c"/>
  <text x="677" y="654" class="node-title">Summarize</text>
  <text x="677" y="679" class="node-copy">Gemini API · summarizes the transcript</text>
  <text x="677" y="702" class="tag">1 transcript → 1 summary</text>

  <!-- Shared object storage, with stage outputs passed as the next input. -->
  <rect x="1082" y="352" width="258" height="164" rx="16" fill="#fff7e8" stroke="#e7c98e" stroke-width="1.5"/>
  <path d="M1104 382 C1104 371 1158 363 1211 363 C1264 363 1318 371 1318 382 C1318 393 1264 401 1211 401 C1158 401 1104 393 1104 382 Z" fill="#f3dfb7" stroke="#d7b66f" stroke-width="1.3"/>
  <path d="M1104 382 V482 C1104 493 1158 501 1211 501 C1264 501 1318 493 1318 482 V382" fill="#fff2d8" stroke="#d7b66f" stroke-width="1.3"/>
  <path d="M1104 432 C1104 443 1158 451 1211 451 C1264 451 1318 443 1318 432" fill="none" stroke="#d7b66f" stroke-width="1.2"/>
  <text x="1211" y="428" text-anchor="middle" class="node-title">S3 / RustFS</text>
  <text x="1211" y="455" text-anchor="middle" class="node-copy">Downloads inputs</text>
  <text x="1211" y="476" text-anchor="middle" class="node-copy">Stores stage artifacts</text>

  <!-- Orchestration dispatch and artifact/result flow. -->
  <path d="M310 368 H335 V240 H365" class="line"/>
  <path d="M335 384 H365" class="line"/>
  <path d="M335 384 V528 H365" class="line"/>
  <path d="M335 384 V672 H365" class="line"/>
  <text x="318" y="324" class="tag" transform="rotate(-90 318 324)">selected next stage</text>

  <path d="M575 240 H652" class="line"/>
  <path d="M575 384 H652" class="line"/>
  <path d="M575 528 H652" class="line"/>
  <path d="M575 672 H652" class="line"/>

  <path d="M962 240 H1014 V340 H1125" class="bi-line"/>
  <path d="M962 384 H1082" class="bi-line"/>
  <path d="M962 528 H1014 V486 H1082" class="bi-line"/>
  <path d="M962 672 H1038 V516 H1125" class="bi-line"/>
  <text x="980" y="224" class="tag">download input / upload output</text>

  <rect x="498" y="779" width="444" height="66" rx="14" fill="#e8f4f1" stroke="#acd7cd" stroke-width="1.5"/>
  <circle cx="525" cy="812" r="7" fill="#15847b"/>
  <text x="545" y="807" class="topic-text">sonclarus-results</text>
  <text x="545" y="829" class="tag">stage metadata · file keys · initial file hash</text>
  <path d="M807 722 V779" class="teal-line"/>
  <path d="M962 240 H1000 V758 H942 V779" class="teal-line"/>
  <path d="M962 384 H1018 V751 H942 V779" class="teal-line"/>
  <path d="M962 528 H1036 V744 H942 V779" class="teal-line"/>

  <path d="M498 812 H420 V529 H310" class="teal-line"/>
  <text x="334" y="794" class="tag">backend saves result and dispatches next selected stage</text>

  <text x="64" y="875" class="subtitle">Each consumer commits its input only after processing and publishing the result succeeds.</text>
</svg>
