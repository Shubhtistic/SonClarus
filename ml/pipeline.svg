<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">SonClarus ML processing pipeline</title>
  <desc id="description">The backend dispatches selected stages through four Kafka topics. Four independent ML consumers download inputs from S3-compatible storage, run their models, upload outputs, and publish results to Kafka for the backend to save and dispatch the next selected stage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58708f"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15847b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #10243a; font-size: 31px; font-weight: 700; }
      .subtitle { fill: #52657a; font-size: 15px; }
      .section { fill: #61758b; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .node-title { fill: #17324d; font-size: 17px; font-weight: 700; }
      .node-copy { fill: #52657a; font-size: 13px; }
      .topic-text { fill: #183750; font-size: 14px; font-weight: 600; }
      .tag { fill: #53677c; font-size: 11px; font-weight: 600; }
      .tag-c { fill: #53677c; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .lane { fill: #fbfcfe; stroke: #e5ebf2; stroke-width: 1.3; }
      .line { fill: none; stroke: #58708f; stroke-width: 2.2; }
      .teal { fill: none; stroke: #15847b; stroke-width: 2.4; }
      .halo { fill: none; stroke: #fbfcfe; stroke-width: 10; }
    </style>
  </defs>

  <!-- Background and header -->
  <rect width="1440" height="900" rx="22" fill="#f5f8fb"/>
  <text x="64" y="70" class="title">SonClarus ML processing pipeline</text>
  <text x="64" y="101" class="subtitle">Four independent consumers run in parallel; the backend selects and queues each job’s next stage.</text>

  <!-- Column headings (x: 64 / 368 / 668 / 1112) -->
  <text x="64" y="155" class="section">BACKEND ORCHESTRATION</text>
  <text x="368" y="155" class="section">STAGE INPUT TOPICS</text>
  <text x="668" y="155" class="section">PARALLEL ML CONSUMERS</text>
  <text x="1112" y="155" class="section">SHARED ARTIFACT STORAGE</text>

  <!-- Horizontal lanes: one per stage. Row centres: 230 / 370 / 510 / 650 -->
  <rect x="40" y="170" width="1360" height="120" rx="16" class="lane"/>
  <rect x="40" y="310" width="1360" height="120" rx="16" class="lane"/>
  <rect x="40" y="450" width="1360" height="120" rx="16" class="lane"/>
  <rect x="40" y="590" width="1360" height="120" rx="16" class="lane"/>

  <!-- ========== NODES ========== -->

  <!-- Backend -->
  <rect x="64" y="330" width="200" height="240" rx="16" fill="#eaf1fb" stroke="#b8c9df" stroke-width="1.5"/>
  <rect x="84" y="352" width="34" height="24" rx="6" fill="#365f91"/>
  <text x="101" y="369" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">API</text>
  <text x="84" y="406" class="node-title">Backend</text>
  <text x="84" y="432" class="node-copy">1. Queues the selected stage</text>
  <text x="84" y="454" class="node-copy">2. Saves the ML result</text>
  <text x="84" y="476" class="node-copy">3. Queues the next stage</text>
  <text x="84" y="518" class="tag">Job state and stage order</text>

  <!-- Input topics -->
  <rect x="368" y="201" width="200" height="58" rx="12" fill="#e8f4f1" stroke="#acd7cd" stroke-width="1.4"/>
  <circle cx="392" cy="230" r="7" fill="#15847b"/>
  <text x="410" y="235" class="topic-text">denoise</text>
  <rect x="368" y="341" width="200" height="58" rx="12" fill="#e8f4f1" stroke="#acd7cd" stroke-width="1.4"/>
  <circle cx="392" cy="370" r="7" fill="#15847b"/>
  <text x="410" y="375" class="topic-text">separate</text>
  <rect x="368" y="481" width="200" height="58" rx="12" fill="#e8f4f1" stroke="#acd7cd" stroke-width="1.4"/>
  <circle cx="392" cy="510" r="7" fill="#15847b"/>
  <text x="410" y="515" class="topic-text">transcribe</text>
  <rect x="368" y="621" width="200" height="58" rx="12" fill="#e8f4f1" stroke="#acd7cd" stroke-width="1.4"/>
  <circle cx="392" cy="650" r="7" fill="#15847b"/>
  <text x="410" y="655" class="topic-text">summarize</text>

  <!-- ML consumers -->
  <rect x="668" y="182" width="300" height="96" rx="14" fill="#ffffff" stroke="#d2deea" stroke-width="1.5"/>
  <rect x="668" y="182" width="7" height="96" rx="3.5" fill="#4679b8"/>
  <text x="692" y="212" class="node-title">Denoise</text>
  <text x="692" y="236" class="node-copy">DeepFilterNet3 · cleans the input audio</text>
  <text x="692" y="258" class="tag">1 audio file → 1 cleaned audio file</text>

  <rect x="668" y="322" width="300" height="96" rx="14" fill="#ffffff" stroke="#d2deea" stroke-width="1.5"/>
  <rect x="668" y="322" width="7" height="96" rx="3.5" fill="#7659a8"/>
  <text x="692" y="352" class="node-title">Separate</text>
  <text x="692" y="376" class="node-copy">MossFormer2 · splits speakers</text>
  <text x="692" y="398" class="tag">1 audio file → 2 speaker tracks</text>

  <rect x="668" y="462" width="300" height="96" rx="14" fill="#ffffff" stroke="#d2deea" stroke-width="1.5"/>
  <rect x="668" y="462" width="7" height="96" rx="3.5" fill="#c27a24"/>
  <text x="692" y="492" class="node-title">Transcribe</text>
  <text x="692" y="516" class="node-copy">Faster Whisper · turns audio into text</text>
  <text x="692" y="538" class="tag">1 file or 2 tracks → 1 transcript</text>

  <rect x="668" y="602" width="300" height="96" rx="14" fill="#ffffff" stroke="#d2deea" stroke-width="1.5"/>
  <rect x="668" y="602" width="7" height="96" rx="3.5" fill="#25836c"/>
  <text x="692" y="632" class="node-title">Summarize</text>
  <text x="692" y="656" class="node-copy">Gemini API · summarizes the transcript</text>
  <text x="692" y="678" class="tag">1 transcript → 1 summary</text>

  <!-- Shared storage (tall box so every consumer reaches it with a straight line) -->
  <rect x="1112" y="190" width="264" height="500" rx="16" fill="#fff7e8" stroke="#e7c98e" stroke-width="1.5"/>
  <path d="M1194 340 C1194 328 1294 328 1294 340 C1294 352 1194 352 1194 340 Z" fill="#f3dfb7" stroke="#d7b66f" stroke-width="1.3"/>
  <path d="M1194 340 V420 C1194 432 1294 432 1294 420 V340" fill="#fff2d8" stroke="#d7b66f" stroke-width="1.3"/>
  <path d="M1194 380 C1194 392 1294 392 1294 380" fill="none" stroke="#d7b66f" stroke-width="1.2"/>
  <text x="1244" y="474" text-anchor="middle" class="node-title">S3 / RustFS</text>
  <text x="1244" y="500" text-anchor="middle" class="node-copy">Downloads inputs</text>
  <text x="1244" y="521" text-anchor="middle" class="node-copy">Stores stage artifacts</text>

  <!-- Results topic -->
  <rect x="668" y="750" width="300" height="80" rx="14" fill="#e8f4f1" stroke="#acd7cd" stroke-width="1.5"/>
  <circle cx="696" cy="782" r="7" fill="#15847b"/>
  <text x="716" y="787" class="topic-text">sonclarus-results</text>
  <text x="716" y="810" class="tag">metadata · file keys · initial file hash</text>

  <!-- ========== CONNECTORS ========== -->

  <!-- Backend -> topics (shared bus in the 100px gutter, one arrow per topic) -->
  <path d="M264 450H316" class="line"/>
  <path d="M316 230V650" class="line"/>
  <path d="M316 230H366" class="line" marker-end="url(#arrow)"/>
  <path d="M316 370H366" class="line" marker-end="url(#arrow)"/>
  <path d="M316 510H366" class="line" marker-end="url(#arrow)"/>
  <path d="M316 650H366" class="line" marker-end="url(#arrow)"/>

  <!-- Topics -> consumers -->
  <path d="M568 230H666" class="line" marker-end="url(#arrow)"/>
  <path d="M568 370H666" class="line" marker-end="url(#arrow)"/>
  <path d="M568 510H666" class="line" marker-end="url(#arrow)"/>
  <path d="M568 650H666" class="line" marker-end="url(#arrow)"/>

  <!-- Consumers <-> storage (upper line of each row) -->
  <path d="M968 212H1110" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M968 352H1110" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M968 492H1110" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M968 632H1110" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1040" y="202" class="tag-c">download / upload</text>

  <!-- Consumers -> results topic (lower line of each row, joined by a rail).
       The halo makes the rail pass cleanly over the storage lines. -->
  <path d="M1040 248V790" class="halo"/>
  <path d="M968 248H1040" class="teal"/>
  <path d="M968 388H1040" class="teal"/>
  <path d="M968 528H1040" class="teal"/>
  <path d="M968 668H1040" class="teal"/>
  <path d="M1040 248V790H970" class="teal" marker-end="url(#arrow-teal)"/>
  <text x="1004" y="240" class="tag-c">result</text>

  <!-- Results topic -> backend -->
  <path d="M668 790H164V572" class="teal" marker-end="url(#arrow-teal)"/>
  <text x="416" y="780" class="tag-c">backend saves the result and dispatches the next selected stage</text>

  <!-- Footer -->
  <text x="64" y="875" class="subtitle">Each consumer commits its input only after processing and publishing the result succeeds.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
