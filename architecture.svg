<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">SonClarus project architecture</title>
  <desc id="description">The web client sends API requests to FastAPI and uploads audio directly to S3-compatible storage. FastAPI queues work in Kafka. Four ML workers process each stage and publish results for the backend consumer, which updates PostgreSQL. Redis stores cache and token revocation state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14243b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#49d7c3"/>
      <stop offset="1" stop-color="#77a8ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9bb0ca"/>
    </marker>
    <marker id="arrowMint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#49d7c3"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#77a8ff"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { fill: #f4f8ff; font-size: 34px; font-weight: 700; }
      .subtitle { fill: #a7b8ce; font-size: 15px; }
      .group { fill: #e7eef8; font-size: 14px; font-weight: 700; letter-spacing: 1.2px; }
      .node-title { fill: #f4f8ff; font-size: 16px; font-weight: 700; }
      .node-sub { fill: #adbed2; font-size: 13px; }
      .small { fill: #b6c6d8; font-size: 12px; }
      .label { fill: #c5d3e3; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .mid { text-anchor: middle; }
    </style>
  </defs>

  <!-- Background and header -->
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <text x="40" y="70" class="title">SonClarus · system architecture</text>
  <text x="42" y="102" class="subtitle">Kafka-driven audio processing · direct object storage · independent stage workers</text>
  <path d="M40 130H1400" stroke="url(#accent)" stroke-width="2" opacity=".8"/>

  <!-- ========== COLUMN CONTAINERS (x: 40 / 340 / 720 / 1070, gutters = 100px) ========== -->

  <!-- Client -->
  <rect x="40" y="185" width="200" height="215" rx="18" fill="#1c3150" stroke="#426287"/>
  <rect x="60" y="205" width="40" height="40" rx="11" fill="#284c6b"/>
  <path d="M72 217h16v16H72zM69 237h22" fill="none" stroke="#83d9d0" stroke-width="2" stroke-linecap="round"/>
  <text x="60" y="280" class="node-title">Web client</text>
  <text x="60" y="308" class="node-sub">Sign in and manage jobs</text>
  <text x="60" y="330" class="node-sub">Request upload and status</text>
  <text x="60" y="352" class="node-sub">Get signed download links</text>

  <!-- Backend -->
  <rect x="340" y="185" width="280" height="425" rx="20" fill="#14263b" stroke="#35516d" stroke-width="1.5"/>
  <text x="360" y="215" class="group">BACKEND SERVICES</text>

  <rect x="360" y="240" width="240" height="100" rx="14" fill="#213d5a" stroke="#4d7598"/>
  <circle cx="386" cy="268" r="11" fill="#49d7c3" opacity=".9"/>
  <text x="408" y="274" class="node-title">FastAPI</text>
  <text x="378" y="304" class="node-sub">Auth · upload · dashboard API</text>
  <text x="378" y="324" class="node-sub">Signs storage URLs</text>

  <rect x="360" y="360" width="112" height="80" rx="14" fill="#1b344d" stroke="#3e637f"/>
  <text x="416" y="384" class="node-title mid" style="font-size:14px">PostgreSQL</text>
  <text x="416" y="406" class="small mid">Users and jobs</text>

  <rect x="488" y="360" width="112" height="80" rx="14" fill="#1b344d" stroke="#3e637f"/>
  <text x="544" y="384" class="node-title mid" style="font-size:14px">Redis</text>
  <text x="544" y="406" class="small mid">Cache and token</text>
  <text x="544" y="422" class="small mid">revocation</text>

  <rect x="360" y="460" width="240" height="100" rx="14" fill="#213d5a" stroke="#4d7598"/>
  <circle cx="386" cy="488" r="11" fill="#77a8ff" opacity=".9"/>
  <text x="408" y="494" class="node-title">Result consumer</text>
  <text x="378" y="524" class="node-sub">Validates stage results</text>
  <text x="378" y="544" class="node-sub">Updates jobs · queues next stage</text>

  <!-- Kafka -->
  <rect x="720" y="185" width="250" height="425" rx="20" fill="#202a3d" stroke="#846347" stroke-width="1.5"/>
  <text x="740" y="215" class="group">SHARED KAFKA</text>
  <text x="740" y="237" class="node-sub">Work topics and result topic</text>

  <rect x="740" y="268" width="210" height="44" rx="11" fill="#3b3340" stroke="#b0835b"/>
  <circle cx="762" cy="290" r="6" fill="#ffbf76"/><text x="780" y="295" class="node-title" style="font-size:14px">denoise</text>
  <rect x="740" y="322" width="210" height="44" rx="11" fill="#3b3340" stroke="#b0835b"/>
  <circle cx="762" cy="344" r="6" fill="#ffbf76"/><text x="780" y="349" class="node-title" style="font-size:14px">separate</text>
  <rect x="740" y="376" width="210" height="44" rx="11" fill="#3b3340" stroke="#b0835b"/>
  <circle cx="762" cy="398" r="6" fill="#ffbf76"/><text x="780" y="403" class="node-title" style="font-size:14px">transcribe</text>
  <rect x="740" y="430" width="210" height="44" rx="11" fill="#3b3340" stroke="#b0835b"/>
  <circle cx="762" cy="452" r="6" fill="#ffbf76"/><text x="780" y="457" class="node-title" style="font-size:14px">summarize</text>

  <rect x="740" y="516" width="210" height="44" rx="11" fill="#183c48" stroke="#49b8ad"/>
  <circle cx="762" cy="538" r="6" fill="#63e0ca"/><text x="780" y="543" class="node-title" style="font-size:14px">sonclarus-results</text>

  <!-- ML workers -->
  <rect x="1070" y="185" width="330" height="425" rx="20" fill="#142d35" stroke="#377f76" stroke-width="1.5"/>
  <text x="1090" y="215" class="group">ML STAGE CONSUMERS</text>
  <text x="1090" y="237" class="node-sub">Run concurrently in the ML service</text>

  <rect x="1090" y="268" width="290" height="44" rx="11" fill="#1c4549" stroke="#3e968d"/>
  <circle cx="1112" cy="290" r="6" fill="#63e0ca"/><text x="1130" y="295" class="node-title" style="font-size:14px">Denoise · DeepFilterNet</text>
  <rect x="1090" y="322" width="290" height="44" rx="11" fill="#1c4549" stroke="#3e968d"/>
  <circle cx="1112" cy="344" r="6" fill="#63e0ca"/><text x="1130" y="349" class="node-title" style="font-size:14px">Separate · MossFormer2</text>
  <rect x="1090" y="376" width="290" height="44" rx="11" fill="#1c4549" stroke="#3e968d"/>
  <circle cx="1112" cy="398" r="6" fill="#63e0ca"/><text x="1130" y="403" class="node-title" style="font-size:14px">Transcribe · Whisper</text>
  <rect x="1090" y="430" width="290" height="44" rx="11" fill="#1c4549" stroke="#3e968d"/>
  <circle cx="1112" cy="452" r="6" fill="#63e0ca"/><text x="1130" y="457" class="node-title" style="font-size:14px">Summarize · Gemini</text>

  <!-- S3 / RustFS -->
  <rect x="1070" y="700" width="330" height="130" rx="18" fill="#342f4a" stroke="#8275b5" stroke-width="1.5"/>
  <path d="M1094 738h40v34h-40zM1099 731h30M1099 779h30" fill="none" stroke="#c2b4ff" stroke-width="2" stroke-linecap="round"/>
  <text x="1154" y="752" class="node-title">S3 / RustFS</text>
  <text x="1154" y="774" class="node-sub">Original audio and artifacts</text>
  <text x="1094" y="806" class="small">Services use the private endpoint</text>
  <text x="1094" y="823" class="small">Browsers use signed public URLs</text>

  <!-- ========== CONNECTORS (labels sit in the 100px gutters, never on cards) ========== -->

  <!-- Client -> FastAPI -->
  <path d="M240 290H358" stroke="#9bb0ca" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="279" class="label">API requests</text>

  <!-- FastAPI -> Kafka (first stage) -->
  <path d="M600 290H738" stroke="#9bb0ca" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="670" y="279" class="label">Publish stage</text>

  <!-- Result consumer -> Kafka (next stage) -->
  <path d="M600 482H718" stroke="#9bb0ca" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="670" y="471" class="label">Next stage</text>

  <!-- Kafka results -> Result consumer -->
  <path d="M738 538H602" stroke="#77a8ff" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="670" y="527" class="label">Results</text>

  <!-- Kafka topics -> ML workers (one straight arrow per stage) -->
  <path d="M950 290H1088" stroke="#49d7c3" stroke-width="2" fill="none" marker-end="url(#arrowMint)"/>
  <path d="M950 344H1088" stroke="#49d7c3" stroke-width="2" fill="none" marker-end="url(#arrowMint)"/>
  <path d="M950 398H1088" stroke="#49d7c3" stroke-width="2" fill="none" marker-end="url(#arrowMint)"/>
  <path d="M950 452H1088" stroke="#49d7c3" stroke-width="2" fill="none" marker-end="url(#arrowMint)"/>
  <text x="1020" y="279" class="label">Stage topics</text>

  <!-- ML workers -> storage -->
  <path d="M1235 610V698" stroke="#9bb0ca" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="1249" y="660" class="small" style="font-weight:600">Read and write artifacts</text>

  <!-- Client -> storage (runs under the backend and Kafka columns) -->
  <path d="M140 400V765H1068" stroke="#49d7c3" stroke-width="2" fill="none" marker-end="url(#arrowMint)"/>
  <text x="600" y="752" class="label">Direct upload · signed downloads</text>

  <!-- Footer -->
  <text x="40" y="868" class="small">SonClarus · development architecture · API, result consumer, Kafka, ML workers, PostgreSQL, Redis and S3-compatible storage</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
