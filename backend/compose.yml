services:

  # --- postgres ---
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sonclarus_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3


  # --- redis ---
  redis:
    image: redis:7-bookworm
    ports:
      - "6380:6379"
    volumes:
      - sonclarus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3


  # --- kafka ---
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - sonclarus_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
  # ===================================================================
  # Optional: local RustFS S3 service for this compose file.
  #
  # Use this when you do not have a separate shared RustFS server and want
  # local S3 to start and stop with this project. It uses this compose file's
  # default network and does not need the external "storage-net" network.
  #
  # To enable it:
  #   1. Uncomment the "rustfs" service below and the
  #      "sonclarus_rustfs_data" volume at the bottom of this file.
  #   2. Add these settings to .env. RustFS reuses the AWS_* keys:
  #        AWS_ACCESS_KEY_ID=SONCLARUSKEY123   # uppercase alphanumeric
  #        AWS_SECRET_ACCESS_KEY=<long random secret, e.g. openssl rand -base64 24>
  #        AWS_REGION=ap-south-1               # label only
  #        AWS_BUCKET_NAME=sonclarus1
  #        AWS_ENDPOINT_URL=http://rustfs:9000        # backend -> RustFS inside Docker
  #        AWS_PUBLIC_ENDPOINT_URL=http://localhost:9000  # used for presigned URLs;
  #                                                       # must be reachable by the browser
  #   3. Run: docker compose up -d
  #   4. Open http://localhost:9001, log in with the AWS_* keys, and create the
  #      bucket named in AWS_BUCKET_NAME. It is not created automatically.
  #
  # Notes:
  #   - Presigned URLs use the host in the endpoint. Generate them with the
  #     public endpoint (localhost:9000), not rustfs:9000.
  #   - Optionally add rustfs under backend -> depends_on to start it first.
  #   - For a shared RustFS server, leave this block commented out and point
  #     AWS_ENDPOINT_URL at that server.
  #   - For production AWS, leave this block out and do not set
  #     AWS_ENDPOINT_URL.
  # ===================================================================
  # rustfs:
  #   image: rustfs/rustfs:latest
  #   restart: unless-stopped
  #   ports:
  #     - "9000:9000"   # S3 API
  #     - "9001:9001"   # web console
  #   environment:
  #     RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
  #     RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
  #   volumes:
  #     - sonclarus_rustfs_data:/data

  # --- Alembic ---
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file: .env
    volumes:
      - ./alembic:/sonclarus/backend/alembic
      - ./alembic.ini:/sonclarus/backend/alembic.ini
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy


  # --- Backend ---     
  backend:
    build:
      context: .
      target: runtime
    command: ["uvicorn", "src.sonclarus.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/sonclarus/backend/src
      - ./alembic:/sonclarus/backend/alembic
      - ./alembic.ini:/sonclarus/backend/alembic.ini
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_healthy # remove if you use a managed Kafka cluster
    networks:
      - default
      - my-storage-net # remove if you add RustFS to this compose file

      
volumes:
  sonclarus_pg_data:
  sonclarus_redis_data:
  sonclarus_kafka_data:
  # sonclarus_rustfs_data:   # uncomment with the RustFS service above


# Remove this network if you add RustFS to this compose file.
networks:
  my-storage-net:
    external: true
